<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprouts &mdash; a finished game</title>
<link rel="stylesheet" href="../manual.css?v=202">
<style>
  body { text-align: center; }
  img { width: 50%; height: auto; border: 1px solid #6495ED; }
  p { margin: 0.6em 0; }
</style>
</head>
<body>
<h1 id="title">The Game of Sprouts</h1>
<p id="caption"></p>
<a id="full" href="#"><img id="picture" alt="the final position of a game"></a>
<p>Shown at half size; click the picture for the full size. <a href="../manual.html#sec-games-played-to-the-end">Back to the User&rsquo;s Guide</a>.</p>
<script>
  /* games/view.html?n=30 shows games/n30.png at half size (the manual's table of games played to the end) */
  var n = Number(new URLSearchParams(location.search).get('n')) || 10, src = 'n' + n + '.png';
  document.getElementById('picture').src = src;
  document.getElementById('full').href = src;
  document.getElementById('caption').textContent = 'A game of ' + n + ' seeds, Random against Random, played to the end';
  document.title = 'Sprouts — a game of ' + n + ' seeds';
</script>
</body>
</html>
